    --blue-t:#0F1B33; --blue-t2:#16284A;
    --warn:#E0A84A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  }
  html[data-theme="dark"] .hero{
    background:linear-gradient(135deg,#0A34A6 0%,#0B45C8 45%,#2A64D8 100%);
    box-shadow:0 20px 44px rgba(0,20,90,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit}   /* form controls do not inherit type by default */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- shell ---------------- */
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{
    width:258px;flex:0 0 258px;background:var(--sidebar);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 14px 14px;transition:width .18s;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
  .brand .word{font-size:19px;font-weight:600;letter-spacing:-.4px}
  .brand svg{display:block}
  .quick{display:flex;gap:8px;padding:0 2px 18px}
  .quick .btn{flex:1;padding:11px;font-size:14px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .navitem{
    display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:12px;border:0;background:none;
    color:var(--muted);font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .12s,color .12s
  }
  .navitem svg{width:21px;height:21px;flex:0 0 auto}
  .navitem:hover{background:var(--chip);color:var(--text)}
  .navitem.active{background:var(--blue-t);color:var(--blue)}
  html[data-theme="dark"] .navitem.active{background:var(--blue-t)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
  .siderow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--text);text-align:left;width:100%}
  .siderow:hover{background:var(--chip)}
  .siderow .lbl{flex:1;font-weight:500;font-size:14px}
  .siderow .sub{color:var(--faint);font-size:12px;font-weight:600}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0052FF,#4C8DFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:0 0 auto}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{height:72px;flex:0 0 72px;display:flex;align-items:center;gap:16px;padding:0 26px;border-bottom:1px solid var(--line);background:var(--bg);z-index:20}
  .topbar h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.4px;flex:0 0 auto}
  .search{position:relative;margin-left:auto;width:320px;max-width:38vw}
  .search input{
    width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 14px 11px 40px;
    font-size:14px;font-weight:600;color:var(--text);outline:none;transition:border-color .15s,background .15s
  }
  .search input:focus{border-color:var(--blue);background:var(--bg)}
  .search input::placeholder{color:var(--faint);font-weight:500}
  .search .sic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);display:flex}
  .search .sic svg{width:17px;height:17px}
  .searchres{
    position:absolute;top:52px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:6px;display:none;max-height:340px;overflow:auto;z-index:30
  }
  .searchres.on{display:block}
  .searchres .sr{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .searchres .sr:hover{background:var(--card2)}
  .searchres .sr .nm{font-weight:600;flex:1}
  .searchres .sr .pr{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .balchip{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .balchip small{color:var(--faint);font-weight:500;font-size:11.5px;display:block;line-height:1}
  .livepill{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
  .livepill:hover{color:var(--text)}
  .livepill .ldot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(5,177,105,.16);flex:0 0 auto}
  .livepill.off{color:var(--faint)}
  .livepill.off .ldot{background:var(--faint);box-shadow:none}
  .livepill.busy .ldot{background:var(--blue);animation:lpulse 1s ease-in-out infinite}
  @keyframes lpulse{50%{opacity:.25}}
  .iconbtn{
    width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .1s;flex:0 0 auto
  }
  .iconbtn:hover{background:var(--card2)}
  .iconbtn:active{transform:scale(.95)}
  .iconbtn svg{width:19px;height:19px}
  .sysnote{position:absolute;top:80px;left:0;right:0;text-align:center;color:var(--faint);font-size:11px}
  .content{flex:1;overflow-y:auto;padding:26px 26px 60px}

  /* ---------------- primitives ---------------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px 22px}
  .btn{
    border:0;border-radius:999px;padding:13px 18px;font-size:14.5px;font-weight:600;cursor:pointer;
    background:var(--blue);color:#fff;transition:filter .12s,transform .1s
  }
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.ghost{background:var(--chip);color:var(--text)}
  .btn.ghost:hover{background:var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
  .btn.wide{width:100%}
  .link{color:var(--blue);font-weight:600;background:none;border:0;cursor:pointer;font-size:13.5px}
  .coin{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex:0 0 auto}
  .up{color:var(--green)} .down{color:var(--red)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .num{font-variant-numeric:tabular-nums}
  .hiddenv{letter-spacing:2px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .secthead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
  .secthead h2{font-size:16.5px;font-weight:600;margin:0;letter-spacing:-.2px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .seg{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:none;color:var(--faint);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* ---------------- hero ---------------- */
  .hero{
    background:linear-gradient(135deg,#0043D0 0%,#0052FF 45%,#3B82FF 100%);
    border-radius:22px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,82,255,.28)
  }
  .hero::after{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.09)}
  .hero::before{content:"";position:absolute;right:80px;bottom:-160px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
  .hero .row1{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
  .hero .lbl{font-size:13px;font-weight:500;opacity:.82;display:flex;align-items:center;gap:8px}
  .hero .bal{font-size:46px;font-weight:600;letter-spacing:-1.2px;margin:8px 0 6px;font-variant-numeric:tabular-nums}
  .hero .chg{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .hero .chg .pill{background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px}
  .hero .eye{border:0;background:rgba(255,255,255,.16);color:#fff;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .hero .eye svg{width:16px;height:16px}
  .hero-btns{display:flex;gap:4px;margin-top:20px;position:relative;z-index:2}
  .hero-btn{
    border:0;background:none;color:#fff;font-weight:600;font-size:12.5px;padding:0;flex:1;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px
  }
  .hero-btn svg{width:48px;height:48px;padding:14px;box-sizing:border-box;border-radius:999px;
    background:rgba(255,255,255,.16);transition:background .12s}
  .hero-btn:hover svg{background:rgba(255,255,255,.28)}
  .hero-btn.solid svg{background:#fff;color:var(--blue)}
  .hero-btn.solid:hover svg{background:#eef4ff}

  /* ---------------- chart ---------------- */
  .chartcard{padding:20px 22px 10px}
  .chart-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .chart-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .chart-price .big{font-size:28px;font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
  .chart-price .sub{font-size:13.5px;font-weight:600}
  .pills{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:12.5px;padding:6px 11px 6px 7px;border-radius:999px;cursor:pointer}
  .pill .coin{width:22px;height:22px;font-size:11px}
  .pill.on{background:var(--blue-t);border-color:var(--blue-t2);color:var(--blue)}
  .chart{width:100%;height:250px;display:block;margin-top:8px;cursor:crosshair}
  .chart-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px}

  /* ---------------- table ---------------- */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{
    text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:13px 20px;border-bottom:1px solid var(--line);
    white-space:nowrap;background:var(--card)
  }
  .tbl td{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  .tbl tbody tr{cursor:pointer;transition:background .1s}
  .tbl tbody tr:hover{background:var(--card2)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl .r{text-align:right}
  .tbl .cellasset{display:flex;align-items:center;gap:12px;font-weight:600}
  .tbl .cellasset .nm{font-size:14.5px}
  .tbl .cellasset .tk{color:var(--faint);font-size:12.5px;font-weight:500}
  .tbl .assetname{font-size:14.5px;font-weight:600}
  .tbl .assettick{display:block;text-align:left;color:var(--faint);font-size:12.5px;font-weight:500}
  .tbl .spark{width:96px;height:34px;display:block}
  .badge{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px}
  .badge.warn{color:var(--warn)} .badge.bad{color:var(--red)}
  .recip{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .recip button{border:1px solid var(--line);background:var(--card2);color:var(--muted);font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recip button:hover{background:var(--chip);color:var(--text)}
  .mini{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);margin-left:6px}
  .mini:hover{background:var(--card2);color:var(--text)}
  .mini svg{width:16px;height:16px}

  /* ---------------- right rail ---------------- */
  .qactions{display:flex;gap:4px}
  .qa{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0;border:0;background:none;cursor:pointer;color:var(--text);font-weight:600;font-size:12.5px}
  .qa .b{width:46px;height:46px;border-radius:999px;background:var(--blue-t);color:var(--blue);display:flex;align-items:center;justify-content:center;transition:background .12s}
  .qa:hover .b{background:var(--blue-t2)}
  .qa .b svg{width:20px;height:20px}
  .railrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .railrow:last-child{border-bottom:0}
  .railrow .ic{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .railrow .ic svg{width:16px;height:16px}
  .railrow .ic.in{background:rgba(5,177,105,.12);color:var(--green)}
  .railrow .ic.out{background:var(--chip);color:var(--text)}
  .railrow .ic.conv{background:var(--blue-t);color:var(--blue)}
  .railrow .m{flex:1;min-width:0}
  .railrow .m .t{font-weight:600;font-size:13.5px}
  .railrow .m .s{color:var(--faint);font-size:12px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .railrow .v{text-align:right;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
  .railrow .v small{display:block;color:var(--faint);font-size:11.5px;font-weight:600;margin-top:1px}

  /* ---------------- settings ---------------- */
  .setrow{display:flex;align-items:center;gap:15px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:var(--text);text-align:left}
  .setrow:last-child{border-bottom:0}
  .setrow:hover{background:var(--card2)}
  .setrow .si{width:38px;height:38px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .setrow .si svg{width:19px;height:19px}
  .setrow .lbl{flex:1;font-weight:600;font-size:14.5px}
  .setrow .lbl small{display:block;color:var(--faint);font-weight:600;font-size:12px;margin-top:2px}
  .setrow .val{color:var(--faint);font-weight:500}
  .switch{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto}
  .switch.on{background:var(--blue)}
  .switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on i{left:22px}

  /* ---------------- trade ---------------- */
  .swapbox{display:flex;flex-direction:column;gap:0}
  .swapfield{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:var(--card)}
  .swapfield .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .swapfield .top .k{color:var(--faint);font-weight:500;font-size:13px}
  .swapfield .top .bal{color:var(--faint);font-weight:500;font-size:12.5px}
  .swapfield .line{display:flex;align-items:center;gap:14px}
  .swapfield input{border:0;background:none;outline:none;font-size:30px;font-weight:600;color:var(--text);width:100%;font-family:inherit;letter-spacing:-.5px}
  .swapfield input::placeholder{color:var(--faint)}
  .assetbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 13px 7px 8px;cursor:pointer;color:var(--text);font-weight:600;font-size:14px;flex:0 0 auto}
  .assetbtn:hover{background:var(--chip)}
  .assetbtn .coin{width:28px;height:28px;font-size:12px}
  .flipwrap{display:flex;justify-content:center;margin:-14px 0;position:relative;z-index:3}
  .flipbtn{width:44px;height:44px;border-radius:50%;border:4px solid var(--bg);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .flipbtn:hover{background:var(--blue-d)}
  .flipbtn svg{width:20px;height:20px}

  /* ---------------- modal ---------------- */
  .overlay{position:fixed;inset:0;background:rgba(6,8,12,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;backdrop-filter:blur(3px)}
  .overlay.on{opacity:1;pointer-events:auto}
  .modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(480px,92vw);max-height:88vh;overflow:auto;
    background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s
  }
  .modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .modal.wide{width:min(660px,94vw)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
  .modal-head h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.2px}
  .modal-body{padding:14px 20px 20px}

  .field{margin-bottom:16px}
  .fl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
  .input{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;transition:border-color .15s}
  .input:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
  .input input{border:0;background:none;outline:none;font-size:15.5px;font-weight:500;color:var(--text);width:100%;font-family:inherit}
  .input input::placeholder{color:var(--faint);font-weight:500}
  .input .suffix{font-weight:600;font-size:14px;color:var(--muted);flex:0 0 auto}
  .maxbtn{background:var(--blue-t);color:var(--blue);border:0;font-weight:600;font-size:12px;border-radius:9px;padding:6px 10px;cursor:pointer;flex:0 0 auto;min-height:32px;display:inline-flex;align-items:center}
  .pastebtn{background:none;border:0;color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;flex:0 0 auto;min-height:32px;display:inline-flex;align-items:center;padding:0 2px}
  .assetpick{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;width:100%;color:var(--text);text-align:left}
  .assetpick:hover{border-color:var(--faint)}
  .assetpick .nm{font-weight:600;font-size:14.5px}
  .assetpick .sb{color:var(--faint);font-size:12.5px;font-weight:600}
  .assetpick .chev{margin-left:auto;color:var(--faint)}
  .opt{display:flex;align-items:center;gap:13px;padding:12px 12px;border-radius:13px;cursor:pointer;border:0;background:none;width:100%;color:var(--text);text-align:left}
  .opt:hover{background:var(--card2)}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted);font-weight:600}
  .kv .v{font-weight:600;text-align:right;word-break:break-all}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 4px}
  .spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;margin:26px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .checkcircle{width:82px;height:82px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:16px auto 0;animation:pop .4s cubic-bezier(.22,1.4,.4,1)}
  .checkcircle svg{width:42px;height:42px}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .qrcard{background:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;margin:6px auto 0;width:max-content}
  .addrbox{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:13px;padding:13px 15px;margin-top:14px}
  .addrbox code{font-size:12.5px;font-weight:500;flex:1;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------------- toasts ---------------- */
  .toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:200;pointer-events:none}
  .toast{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:13.5px;font-weight:500;box-shadow:0 14px 36px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);transition:.25s}
  .toast.on{opacity:1;transform:none}

  /* ---------------- lock screen ---------------- */
  body.locked{overflow:hidden}
  .lock{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:32px;
    background:#131415;color:#eeeeef;overflow:auto}
  .lock.on{display:flex}
  .lockcard{width:min(760px,100%);text-align:center;padding:24px 0;animation:lockin .34s ease-out}
  @keyframes lockin{from{transform:translateY(16px) scale(.97);opacity:0}}
  .lockcard h2{margin:30px 0 12px;font-size:24px;line-height:1.35;font-weight:600;letter-spacing:0}
  .keyart{display:block;width:100%;aspect-ratio:1000/272;margin:0 auto 24px}
  .keyart svg{display:block;width:100%;height:100%}
  .lock.is-ok .lockstat{color:#78b98d}

    color:#a6a6ac;font-weight:400;font-size:14px}
  .lockstat .spinner{width:15px;height:15px;border:2px solid #333539;border-top-color:#7699e9;
    border-radius:50%;display:none;animation:spin .7s linear infinite;flex:0 0 auto}
  .lock.is-search .spinner,.lock.is-connect .spinner{display:block}
  @media(prefers-reduced-motion:reduce){.lock .spinner,.lockcard{animation:none!important}}

  /* ---------------- responsive ---------------- */
  @media (max-width:1160px){ .grid{grid-template-columns:minmax(0,1fr)} .col-side .rail-hideable{}
    .grid .col-side{display:grid;grid-template-columns:1fr 1fr;gap:20px} }
  @media (max-width:880px){
    .sidebar{width:74px;flex-basis:74px;padding:16px 10px}
    .brand .word,.navitem span,.siderow .txt,.quick{display:none}
    .navitem{justify-content:center;padding:12px}

    .siderow .avatar{margin:0}
  }
  @media (max-width:820px){ .search{width:200px} .grid .col-side{grid-template-columns:1fr} }
  @media (max-width:680px){
    .app{flex-direction:column}
    .sidebar{width:100%;flex:0 0 auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
    .nav{flex-direction:row;overflow-x:auto}

  }

<script>
/* ============================ MoonPay — local desktop demo ============================ */

const META = {
  BTC:  { name:'Bitcoin',  color:'#F7931A', sym:'₿' },
  ETH:  { name:'Ethereum', color:'#627EEA', sym:'Ξ' },
  SOL:  { name:'Solana',   color:'#9945FF', sym:'◎' },
  USDC: { name:'USD Coin', color:'#2775CA', sym:'$' },
  DOGE: { name:'Dogecoin', color:'#C2A633', sym:'Ð' },
};
const RATES = { USD:{sym:'$',r:1}, EUR:{sym:'€',r:0.8887}, GBP:{sym:'£',r:0.7499}, NOK:{sym:'kr ',r:9.4410} };
const NETWORK = { BTC:'Bitcoin', ETH:'Ethereum', SOL:'Solana', USDC:'Ethereum', DOGE:'Dogecoin' };
const RANGE_POINTS = { '1H':60, '1D':96, '1W':84, '1M':90, '1Y':120 };
const STORE = 'cbw_1of1_desktop_v2';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rng58(n,alpha='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'){let s='';for(let i=0;i<n;i++)s+=alpha[Math.floor(Math.random()*alpha.length)];return s}

/* ---------- per-chain address and transaction shapes ----------
   A wallet that hands every coin the same 40-character string reads as fake the
   moment someone taps Tron or XRP. Each chain gets its real shape, and anything
   not listed here falls back to a generic base58-looking string. */
const EVM=new Set(['ETH','USDT','USDC','BNB','DAI','USDS','USDE','USYC','USDY','USDG','USD1','USDF','BFUSD','LINK','UNI','AAVE','SHIB','PEPE','ARB','POL','WLD','ONDO','ENA','MORPHO','PYUSD','RLUSD','PAXG','MNT','AERO','GHO','PYTH','QNT','OKB','HYPE','NEXO','CRO','JST','VVV','LIT','RENDER','GRT','CRV','MKR','LDO','SNX','COMP','ENS','SAND','MANA']);
const ADDR_RE={
  BTC:/^(bc1[02-9ac-hj-np-z]{11,71}|[13][1-9A-HJ-NP-Za-km-z]{25,39})$/,
  LTC:/^(ltc1[02-9ac-hj-np-z]{11,71}|[LM3][1-9A-HJ-NP-Za-km-z]{25,39})$/,
  BCH:/^(bitcoincash:)?[qp][0-9a-z]{40,}$/,
  DOGE:/^D[1-9A-HJ-NP-Za-km-z]{33}$/,
  SOL:/^[1-9A-HJ-NP-Za-km-z]{32,44}$/,
  XRP:/^r[1-9A-HJ-NP-Za-km-z]{24,34}$/,
  XLM:/^G[A-Z2-7]{55}$/,
  ADA:/^(addr1|stake1)[0-9a-z]{20,}$/,
  TRX:/^T[1-9A-HJ-NP-Za-km-z]{33}$/,
  ZEC:/^t[13][1-9A-HJ-NP-Za-km-z]{33}$/,
  XMR:/^[48][1-9A-HJ-NP-Za-km-z]{94}$/,
  TON:/^(EQ|UQ|0:)[A-Za-z0-9_:-]{40,}$/,
  DOT:/^1[1-9A-HJ-NP-Za-km-z]{45,47}$/,
  TAO:/^5[1-9A-HJ-NP-Za-km-z]{47}$/,
  ALGO:/^[A-Z2-7]{58}$/,
  HBAR:/^0\.0\.\d{1,12}$/,
  STX:/^S[PM][0-9A-Z]{20,60}(\.[a-z0-9_-]{1,32})?$/,
  ATOM:/^cosmos1[0-9a-z]{38}$/, TIA:/^cosmos1[0-9a-z]{38}$/, INJ:/^inj1[0-9a-z]{38}$/,
  FIL:/^[ft][0-9]{3,6}$/,
  KAS:/^kaspa:[a-z0-9]{50,}$/,
  SUI:/^0x[0-9a-f]{64}$/, APT:/^0x[0-9a-f]{64}$/,
};
const NET_NAME={BTC:'Bitcoin',LTC:'Litecoin',BCH:'Bitcoin Cash',DOGE:'Dogecoin',SOL:'Solana',XRP:'XRP Ledger',XLM:'Stellar',ADA:'Cardano',TRX:'Tron',ZEC:'Zcash',XMR:'Monero',TON:'TON',DOT:'Polkadot',TAO:'Bittensor',ALGO:'Algorand',HBAR:'Hedera',STX:'Stacks',ATOM:'Cosmos',TIA:'Celestia',INJ:'Injective',FIL:'Filecoin',KAS:'Kaspa',SUI:'Sui',APT:'Aptos'};
function addrRe(sym){ return EVM.has(sym) ? /^0x[0-9a-fA-F]{40}$/ : (ADDR_RE[sym]||null); }
// ENS names are legitimate recipients in every real wallet, so accept them too
function validAddress(sym,addr){
  addr=String(addr==null?'':addr).trim();
  if(!addr) return false;
  if(/^[a-z0-9-]{3,}\.eth$/i.test(addr)) return true;
  const re=addrRe(sym);
  return re ? re.test(addr) : /^[A-Za-z0-9:_-]{10,256}$/.test(addr);
}
function networkOf(sym){ return NETWORK[sym] || NET_NAME[sym] || (EVM.has(sym) ? 'Ethereum' : sym); }
function makeAddress(sym){
  if(sym==='BTC') return 'bc1q'+rng58(38,'023456789acdefghjklmnpqrstuvwxyz');
  if(EVM.has(sym)) return '0x'+rng58(40,'0123456789abcdef');
  if(sym==='SOL') return rng58(44);
  if(sym==='DOGE') return 'D'+rng58(33);
  if(sym==='XRP') return 'r'+rng58(33);
  if(sym==='TRX') return 'T'+rng58(33);
  if(sym==='ADA') return 'addr1'+rng58(50,'023456789acdefghjklmnpqrstuvwxyz');
  if(sym==='LTC') return 'ltc1q'+rng58(38,'023456789acdefghjklmnpqrstuvwxyz');
  if(sym==='XLM') return 'G'+rng58(55,'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567');
  if(sym==='ZEC') return 't1'+rng58(33);
  if(sym==='XMR') return '4'+rng58(94);
  if(sym==='TON') return 'UQ'+rng58(46,'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-');
  if(sym==='DOT'||sym==='TAO') return '1'+rng58(47);
  return rng58(40);
}
/* UTXO chains have no 0x prefix; Solana hashes are base58 signatures. */
function txHash(sym){
  if(EVM.has(sym)) return '0x'+rng58(64,'0123456789abcdef');
  if(sym==='SOL') return rng58(88);
  if(sym==='XRP') return rng58(64,'0123456789ABCDEF');
  return rng58(64,'0123456789abcdef');
}
/* "View on explorer" opens a local copy of that chain's explorer: explorer.html#<skin>/<hash>.
   The page reads the same localStorage state, so the timeline agrees with the wallet. */
function explorerSkin(sym){ return skinKeyFor(sym, EVM.has(sym)); }
function explorerLink(sym,hash){ return 'explorer.html#'+explorerSkin(sym)+'/'+encodeURIComponent(hash); }
function explorerName(sym){ return (EXPLORER_SKINS[explorerSkin(sym)]||EXPLORER_SKINS.alt).name; }

/* ---------- state ---------- */
// Built before the first state so holdings can be seeded from the same snapshot the
// Explore list shows — otherwise an offline launch quotes two prices for one coin.
const markets=MARKET_SEED.map(a=>({...a}));
markets.forEach(a=>{ if(!META[a.sym]) META[a.sym]={name:a.name,color:'#5B616E',sym:a.sym[0]}; });
function seedTx(now){
  const M=60000, H=3600000, D=86400000;
  const rows=[
    {type:'send',   sym:'ETH',  amount:0.184,  ts:now-11*M,  status:'pending', confirmations:3,  to:'0x2b8e4a9f1c7d3e5a8b0c2d4e6f8a1b3c5d7e9f0a', fee:0.00042, feeUsd:1.01},
    {type:'buy',    sym:'BTC',  amount:0.0124, ts:now-2*H,   status:'done', to:null, method:'Visa •••• 4242', fee:12.4, feeUsd:12.4},
    {type:'receive',sym:'ETH',  amount:0.42,   ts:now-9*H,   status:'done', from:'0x7f3a91b5c2d84e6a0f1b3c5d7e9a2b4c6d8e0f1a'},
    {type:'send',   sym:'USDC', amount:250,    ts:now-D,     status:'done', to:'0x5c9d2e7f4a1b8c3d6e9f2a5b8c1d4e7f0a3b6c9d', fee:0.00042, feeUsd:0.42},
    {type:'convert',sym:'SOL',  amount:4.2,    ts:now-D-4*H, status:'done', from:'USDC', fee:3.11, feeUsd:3.11},
    {type:'send',   sym:'DOGE', amount:850,    ts:now-2*D,   status:'failed', to:'DH5yaieqoZN36fDVciNyRueRGvGLR3mr7L', fee:1, feeUsd:0.15},
    {type:'buy',    sym:'DOGE', amount:3200,   ts:now-3*D,   status:'done', method:'Bank account •••• 8841', fee:4.87, feeUsd:4.87},
    {type:'receive',sym:'BTC',  amount:0.021,  ts:now-6*D,   status:'done', from:'bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq'},
    {type:'send',   sym:'ETH',  amount:0.31,   ts:now-8*D,   status:'done', to:'0x91cc4d7e0a3b6f9c2e5d8a1b4c7f0e3d6a9b2c5f', fee:0.00063, feeUsd:1.52},
    {type:'buy',    sym:'ETH',  amount:2.5,    ts:now-12*D,  status:'done', method:'Visa •••• 4242', fee:22.15, feeUsd:22.15},
    {type:'send',   sym:'BTC',  amount:0.0045, ts:now-15*D,  status:'done', to:'1BoatSLRHtKNngkdXEeobR76b53LETtpyT', fee:0.000021, feeUsd:1.36},
    {type:'receive',sym:'SOL',  amount:42,     ts:now-19*D,  status:'done', from:'7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU'},
    {type:'buy',    sym:'SOL',  amount:60,     ts:now-24*D,  status:'done', method:'Bank account •••• 8841', fee:0.71, feeUsd:0.71},
    {type:'convert',sym:'BTC',  amount:0.0031, ts:now-31*D,  status:'done', from:'ETH', fee:0.96, feeUsd:0.96},
  ];
  return rows.map((x,i)=>({id:'tx_seed_'+i, hash:txHash(x.sym), confirmations:x.status==='done'?12:(x.confirmations||0), ...x}));
}
function defaultState(){
  const now=Date.now();
  // amounts are the only invented numbers; price and 24h change come from the snapshot
  const held=[['BTC',0.6],['ETH',6],['SOL',90],['USDC',9842.51],['DOGE',20000]];
  const assets=held.map(([sym,amount])=>{
    const m=markets.find(a=>a.sym===sym)||{};
    return {sym, amount, price:isFinite(m.price)?m.price:0, change:isFinite(m.change)?m.change:0};
  });
  const addresses={}; assets.forEach(a=>addresses[a.sym]=makeAddress(a.sym));
  return {
    profile:{name:'ash', handle:'@ash'},
    assets, addresses, receivingAddresses:{},
    transactions:seedTx(now),
    settings:{currency:'USD', hide:false, theme:'dark', lock:true, key:null},
    created:now,
  };
}
let state;
try{ state = JSON.parse(localStorage.getItem(STORE)) || defaultState(); }catch(e){ state=defaultState(); }
if(!state.addresses || !Object.keys(state.addresses).length){ state.addresses={}; state.assets.forEach(a=>state.addresses[a.sym]=makeAddress(a.sym)); }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
if(state.profile && state.profile.name==='Alex Morgan'){ state.profile.name='ash'; state.profile.handle='@ash'; save(); }
if(state.settings.lock===undefined) state.settings.lock = true;
if(!state.receivingAddresses) state.receivingAddresses={};

/* ---------- routing ---------- */
let route={name:'home', params:{}};
let ui={ range:'1D', txFilter:'all', chartSym:'BTC', walletTab:'assets' };
const seriesCache={};
const titles={home:'Wallet', markets:'Explore', asset:'Asset', trade:'Swap', activity:'Activity', settings:'Settings'};
let navigationTimer=null;
function loadingMarkup(label){
  return `<div class="mp-loading" role="status"><span class="mp-loading-label">${esc(label)}</span><div aria-hidden="true"><div class="mp-skeleton mp-skeleton-title"></div><div class="mp-skeleton mp-skeleton-value"></div><div class="mp-loading-rows">${Array.from({length:4},()=>'<div class="mp-loading-row"><i class="mp-skeleton mp-skeleton-circle"></i><i class="mp-skeleton mp-skeleton-line"></i><i class="mp-skeleton mp-skeleton-price"></i></div>').join('')}</div></div></div>`;
}
function loadPage(direction){
  clearTimeout(navigationTimer);
  document.documentElement.setAttribute('data-theme',state.settings.theme);
  const c=$('#content');
  c.setAttribute('aria-busy','true');
  c.innerHTML=loadingMarkup('Loading '+(titles[route.name]||'wallet').toLowerCase()+'…');
  c.scrollTop=0;
  $('#pagetitle').textContent=route.name==='asset'?META[route.params.sym].name:titles[route.name];
  updateChrome();
  navigationTimer=setTimeout(()=>{
    navigationTimer=null; c.removeAttribute('aria-busy'); render(direction);
  },240);
}

function slideIn(el, direction='forward'){
  if(!el || !el.animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.getAnimations().forEach(a=>a.cancel());
  el.animate([{opacity:0,transform:`translateX(${direction==='back'?-22:22}px)`},{opacity:1,transform:'translateX(0)'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function go(name, params={}){
  const order=['home','markets','trade','activity','settings'];
  const back=route.name==='asset' || (name!=='asset' && order.indexOf(name)<order.indexOf(route.name));
  if(name===route.name && JSON.stringify(params)===JSON.stringify(route.params) && navigationTimer===null) return;
  route={name, params}; loadPage(back?'back':'forward');
}
function rerender(){ render(false); }
function render(animate){
  if(animate===true){ loadPage('forward'); return; }
  if(navigationTimer!==null) return;
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  const views={home:viewHome, markets:viewMarkets, asset:viewAsset, trade:viewTrade, activity:viewActivity, settings:viewSettings};
  const c=$('#content'); const st=c.scrollTop;
  const focusId=c.contains(document.activeElement)?document.activeElement.id:null;
  c.innerHTML=(views[route.name]||viewHome)();
  $('#pagetitle').textContent = route.name==='asset' && route.params.sym ? META[route.params.sym].name : (titles[route.name]||'Home');
  updateChrome();
  afterRender();
  c.scrollTop = animate ? 0 : st;
  if(focusId && !animate) document.getElementById(focusId)?.focus({preventScroll:true});
  if(animate) slideIn(c,animate);
}

/* ---------- formatting ---------- */
function cur(){ return RATES[state.settings.currency] || RATES.USD; }
// the buy field is denominated in the display currency, the price table is in USD
function toUSD(n){ return (Number(n)||0)/(cur().r||1); }
function abbrNum(n){
  const u=[[1e12,'T'],[1e9,'B'],[1e6,'M']].find(x=>Math.abs(n)>=x[0]);
  return u ? (n/u[0]).toLocaleString('en-US',{maximumFractionDigits:2})+u[1] : Math.round(n).toLocaleString('en-US');
}
function fmtUSD(n, opts={}){
  const c=cur(); const v=(n||0)*c.r; const abs=Math.abs(v);
  if(opts.compact && abs>=1e6) return c.sym+abbrNum(v);
  const d = abs<1 ? 4 : 2;
  return c.sym + v.toLocaleString('en-US',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtAmt(n, sym){
  const abs=Math.abs(n);
  let d = abs>=1000?2 : abs>=1?4 : 6;
  if(sym==='USDC'||sym==='USDT') d=2;
  if(sym==='BTC') d=8;                        // on-chain BTC is quoted to 8 decimals
  return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d})+' '+sym;
}
function fmtPrice(p){ const abs=Math.abs(p); const d=abs<1?4:2; return cur().sym+(p*cur().r).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const d=Math.floor(h/24); if(d<7) return d+'d ago';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function dayLabel(ts){
  const d=new Date(ts), n=new Date(), day=86400000;
  const s=new Date(d.getFullYear(),d.getMonth(),d.getDate());

// pending transfers tick along the way real ones do; nothing else in the app ever changes state on its own
function tickConfirmations(){
  let changed=false;
  state.transactions.forEach(t=>{
    if(t.status!=='pending') return;
    const need=confirmationsNeeded(t.sym);
    t.confirmations=(t.confirmations||0)+1;
    if(t.confirmations>=need){ t.confirmations=need; t.status='done'; }
    changed=true;
  });
  if(!changed) return false;
  save();
  if($('#modal').classList.contains('on')) return true;      // never rewrite an open dialog
  if(route.name==='home'||route.name==='activity'){ const c=$('#content'); const st=c.scrollTop; render(false); c.scrollTop=st; }
  return true;
}

    .forEach(t=>{ if(seen.has(t.to)||!validAddress(sym,t.to)) return; seen.add(t.to); out.push({address:t.to,ts:t.ts}); });

}

function applyPrices(get, source){
  let n=0;
  state.assets.forEach((a,i)=>{
    const u=get(a,i);
    if(u && isFinite(u.price) && u.price>0){
      a.price=u.price; if(isFinite(u.change)) a.change=u.change;
      // market stats only exist on the CoinGecko feed; the other sources leave them alone
      ['mcap','vol','rank','ath','supply'].forEach(k=>{ if(isFinite(u[k])) a[k]=u[k]; });

  });
  if(!n) throw new Error('no data');

  Object.keys(seriesCache).forEach(k=>delete seriesCache[k]);
  save(); updateLive();
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;

function updateLive(busy){

/* ---------- series ---------- */
function series(sym, range){
  const key=sym+range; if(seriesCache[key]) return seriesCache[key];
  const a=asset(sym); const n=RANGE_POINTS[range]||96;
  const seed=[...key].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,(a.price*1000)|0);
  const rnd=mulberry32(seed>>>0);
  const vol=range==='1H'?0.003:range==='1D'?0.006:range==='1W'?0.018:range==='1M'?0.03:0.06;
  const end=a.price;
  // 1D opens at the price implied by the real 24h change, so the chart agrees with the feed
  let start;
  if(range==='1D' && isFinite(a.change)) start=end/(1+a.change/100);
  else { const base={'1H':0.006,'1D':0.02,'1W':0.05,'1M':0.10,'1Y':0.35}[range]||0.02;
    start=end*(1-(rnd()<0.5?1:-1)*base*(0.35+rnd())); }
  // Brownian bridge: a random walk pinned to both endpoints, so the path is noisy like a real
  // price series but the last sample is exactly the live price and the first is the open.
  const scale=end*vol; let w=0; const walk=[];
  for(let i=0;i<n;i++){ walk.push(w); w+=(rnd()-0.5)*2*scale; }
  const wEnd=walk[n-1];
  const out=walk.map((v,i)=>{ const t=i/(n-1); return start+(end-start)*t+(v-wEnd*t); });
  seriesCache[key]=out; return out;
}
function changeForRange(sym, range){ const s=series(sym,range); return ((s[s.length-1]-s[0])/s[0])*100; }

/* ---------- charts ---------- */
const RANGE_MS={'1H':36e5,'1D':864e5,'1W':6048e5,'1M':2592e6,'1Y':31536e6};
function timeAt(range,i,n){                 // timestamp of sample i, walking back from now
  const d=new Date(Date.now()-(n-1-i)*((RANGE_MS[range]||864e5)/(n-1)));
  if(range==='1H'||range==='1D') return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(range==='1W') return d.toLocaleString('en-US',{weekday:'short',hour:'numeric'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function drawLine(canvas,data,color,opts={}){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth||opts.w||300, h=canvas.clientHeight||opts.h||150;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!data||data.length<2) return;
  const padT=opts.padT!==undefined?opts.padT:12, padB=opts.padB!==undefined?opts.padB:10, padX=opts.padX!==undefined?opts.padX:8;
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const X=i=>padX+(i/(data.length-1))*(w-padX*2);
  const Y=v=>padT+(1-(v-min)/span)*(h-padT-padB);
  if(opts.fill!==false){
    ctx.beginPath(); data.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); });
    ctx.lineTo(X(data.length-1),h); ctx.lineTo(X(0),h); ctx.closePath();
    const g=ctx.createLinearGradient(0,padT,0,h); g.addColorStop(0,hexA(color,.20)); g.addColorStop(1,hexA(color,0));
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.beginPath(); data.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); });
  ctx.strokeStyle=color; ctx.lineWidth=opts.lw||2.2; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  if(opts.dot!==false && opts.hover==null){
    const lx=X(data.length-1), ly=Y(data[data.length-1]);
    ctx.beginPath(); ctx.arc(lx,ly,8,0,7); ctx.fillStyle=hexA(color,.22); ctx.fill();
    ctx.beginPath(); ctx.arc(lx,ly,4.5,0,7); ctx.fillStyle=color; ctx.fill();
  }
  if(opts.hover!=null){                       // crosshair: dotted guide, dot, price + time chips
    const i=Math.max(0,Math.min(data.length-1,Math.round((opts.hover-padX)/((w-padX*2)/(data.length-1)))));
    const hx=X(i), hy=Y(data[i]);
    ctx.save();
    ctx.setLineDash([3,4]); ctx.lineWidth=1; ctx.strokeStyle=hexA(color,.5);
    ctx.beginPath(); ctx.moveTo(hx,padT-6); ctx.lineTo(hx,h-padB+4); ctx.stroke();
    ctx.restore();
    ctx.beginPath(); ctx.arc(hx,hy,9,0,7); ctx.fillStyle=hexA(color,.18); ctx.fill();
    ctx.beginPath(); ctx.arc(hx,hy,4,0,7); ctx.fillStyle=color; ctx.fill();
    const chip=(txt,cx,cy)=>{
      ctx.font='600 11.5px Inter,Roboto,"Noto Sans",sans-serif';
      const bw=ctx.measureText(txt).width+14, bh=19;
      const bx=Math.max(padX,Math.min(w-bw-padX,cx-bw/2));
      const by=Math.max(padT,Math.min(h-padB-bh,cy-bh/2));
      ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,6);
      ctx.fillStyle=hexA(color,.16); ctx.fill();
      ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(txt,bx+bw/2,by+bh/2+0.5);
    };
    chip(fmtPrice(data[i]), w-padX-30, hy);
    chip(timeAt(opts.range,i,data.length), hx, h-padB-12);
  }
}
function hexA(hex,a){ const h=hex.replace('#',''); const b=h.length===3?h.split('').map(c=>c+c).join(''):h; const n=parseInt(b,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

function updateChrome(){
  const items=[['home','Wallet',IC.home],['markets','Explore',IC.dollar],['trade','Swap',IC.trade],['activity','Activity',IC.activity],['settings','Settings',IC.settings]];
  const active = route.name==='asset' ? (state.assets.some(a=>a.sym===route.params.sym)?'home':'markets') : route.name;
  $('#nav').innerHTML=items.map(([k,l,ic])=>`<button class="navitem ${active===k?'active':''}" aria-label="${l}" ${active===k?'aria-current="page"':''} onclick="go('${k}')">${ic}<span>${l}</span></button>`).join('');
  const total=totalUSD();
  $('#balchip').innerHTML=`<span><small>Total balance</small>${hide(fmtUSD(total))}</span>`;
  const eb=$('#eyebtn'); if(eb) eb.innerHTML=state.settings.hide?IC.eyeoff:IC.eye;
  $('#themeicon').innerHTML=IC.moon;
  const sw=$('#themeswitch'); sw.classList.toggle('on', state.settings.theme==='dark');
  const av=$('#sideav'); av.textContent=state.profile.name[0].toUpperCase();
  $('#sidename').textContent=state.profile.name;
  $('#sidehandle').textContent=state.profile.handle;
  updateLive();
}
function afterRender(){
  document.querySelectorAll('canvas[data-chart]').forEach(c=>{
    const sym=c.dataset.sym, range=c.dataset.range||ui.range;
    const paint=pos=>drawLine(c, series(sym,range), '#a95dff', pos==null
      ? {padT:16,padB:14,dot:true,range}
      : {padT:16,padB:14,dot:true,range,hover:pos});
    paint();
    c.onmousemove=e=>paint(e.offsetX);
    c.onmouseleave=()=>paint();
  });
  document.querySelectorAll('canvas[data-spark]').forEach(c=>{
    const sym=c.dataset.spark;
    const ch=changeForRange(sym,'1D');
    // a flat asset gets a neutral line, not a red one next to a 0.00% label
    const col = Math.abs(ch)<0.005 ? '#8A919E' : (ch>=0?'#05B169':'#DF2040');
    drawLine(c, series(sym,'1D'), col, {padT:4,padB:4,padX:1,dot:false,lw:1.6,fill:false});
  });
  const q=$('#qrcanvas'); if(q) drawQR(q,q.dataset.address);
}

function portfolioShares(){
  const total=totalUSD();
  return total>0 ? state.assets.filter(a=>a.amount*a.price>0).map(a=>({sym:a.sym,share:a.amount*a.price/total*100})).sort((a,b)=>b.share-a.share) : [];
}
function receivingWallets(){
  const groups=new Map();
  for(const [sym,r] of Object.entries(state.receivingAddresses)){
    if(!META[sym] || !r.address || !r.network) continue;
    const key=JSON.stringify([r.network.trim().toLowerCase(),r.address,r.memo||'']);
    if(!groups.has(key)) groups.set(key,{...r,id:key,assets:[]});
    groups.get(key).assets.push(sym);
  }
  return [...groups.values()];
}

  const wallets=receivingWallets();
  return `<div class="mp-section-heading"><h2 class="mp-section-title">Your wallets</h2><button class="link" onclick="openPicker('receive')">Add address</button></div>

function requestDeleteWallet(id){

function deleteReceivingWallet(id){
  const wallets=receivingWallets(),wallet=wallets.find(w=>w.id===id);

function ath(sym){ return asset(sym).ath||({BTC:73750,ETH:4870,SOL:259.9,USDC:1.002,DOGE:0.7376})[sym]||1; }
function aboutText(sym){

            </div>
            <div class="line" style="margin-top:8px"><span class="faint" style="font-weight:500" id="convUsd">${amt?'≈ '+hide(fmtUSD(usd)):'Enter an amount'}</span>
              <button class="maxbtn" style="margin-left:auto" onclick="setConvMax()">MAX</button></div>
          </div>
          <div class="flipwrap"><button class="flipbtn" onclick="flipConv()">${IC.trade}</button></div>
          <div class="swapfield">
            <div class="top"><span class="k">To</span><span class="bal">Balance ${hide(fmtAmt(t.amount,conv.to))}</span></div>
            <div class="line">
              <input value="${out?trimNum(out):''}" placeholder="0.00" readonly style="color:var(--text)">
              <button class="assetbtn" onclick="openPicker('tradeTo')">${coinMark(conv.to,28)}${conv.to}<span class="faint">${IC.chev}</span></button>
            </div>
            <div class="line" style="margin-top:8px"><span class="faint" style="font-weight:500" id="convOut">${(out&&!over)?'≈ '+hide(fmtUSD(out*t.price)):'—'}</span></div>
          </div>
        </div>
        <button class="btn wide" id="convBtn" style="margin-top:18px;padding:16px" ${(!amt||conv.from===conv.to||over)?'disabled':''} onclick="openConvertConfirm()">Preview convert</button>

      <div class="card pad">
        <div class="secthead" style="margin:0 0 8px"><h2 style="font-size:15px">Order summary</h2></div>
        <div class="kv"><span class="k">Rate</span><span class="v" id="sumRate">1 ${conv.from} = ${(f.price/t.price).toLocaleString('en-US',{maximumFractionDigits:6})} ${conv.to}</span></div>
        <div class="kv"><span class="k">Estimated fee (0.50%)</span><span class="v" id="sumFee">${hide(fmtUSD(fee))}</span></div>
        <div class="kv"><span class="k">You receive</span><span class="v" id="sumReceive">${(out&&!over)?trimNum(out):'0'} ${conv.to}</span></div>
        <div class="kv"><span class="k">Value</span><span class="v" id="sumValue">${hide(fmtUSD(usd))}</span></div>
      </div>
      <div class="card pad">
        <div class="secthead" style="margin:0 0 8px"><h2 style="font-size:15px">Your balances</h2></div>
        ${state.assets.map(a=>`<div class="railrow" style="cursor:default">${coinMark(a.sym,34)}<div class="m"><div class="t">${a.sym}</div><div class="s">${hide(fmtPrice(a.price))}</div></div><div class="v">${hide(fmtAmt(a.amount,a.sym))}</div></div>`).join('')}
      </div>
    </aside>
  </div>`;
}
function flipConv(){ const x=conv.from; conv.from=conv.to; conv.to=x; render('forward'); }
function setConvMax(){ const f=asset(conv.from); conv.amt=trimNum(f.amount); const el=$('#convAmt'); if(el) el.value=conv.amt; onConvInput(conv.amt); }
function onConvInput(v){
  conv.amt=v; const f=asset(conv.from), t=asset(conv.to);
  const amt=parseFloat(v)||0, usd=amt*f.price, fee=usd*0.005, out=usd?(usd-fee)/t.price:0;
  const over=amt>f.amount+1e-12;
  const set=(id,h)=>{ const e=document.getElementById(id); if(e) e.innerHTML=h; };
  set('convUsd', over? '<span class="down">Insufficient balance</span>' : (amt?('≈ '+hide(fmtUSD(usd))):'Enter an amount'));
  set('convOut', (over||!out)?'—':('≈ '+hide(fmtUSD(out*t.price))));
  set('sumFee', hide(fmtUSD(fee)));
  set('sumReceive', (over||!out)?'0 '+conv.to:trimNum(out)+' '+conv.to);
  set('sumValue', hide(fmtUSD(usd)));
  set('sumRate', '1 '+conv.from+' = '+(f.price/t.price).toLocaleString('en-US',{maximumFractionDigits:6})+' '+conv.to);
  const b=$('#convBtn'); if(b) b.disabled=!(amt && conv.from!==conv.to && !over);
}
function openConvertConfirm(){
  const f=asset(conv.from), t=asset(conv.to);
  const amt=parseFloat(conv.amt)||0, usd=amt*f.price, out=(usd-usd*0.005)/t.price;
  if(!Number.isFinite(amt) || amt<=0 || conv.from===conv.to){ toast('Enter a valid amount'); return; }
  if(amt>f.amount+1e-12){ toast('Insufficient '+conv.from+' balance'); return; }
  loadModal('Preparing swap quote…',()=>showModal(`<div class="modal-head"><h3>Confirm convert</h3><button class="iconbtn" onclick="hideModal()">${IC.close}</button></div>
  <div class="modal-body">
    <div class="center" style="padding-top:0">
      <div style="display:flex;align-items:center;gap:14px">${coinMark(conv.from,44)}<span style="font-size:26px;color:var(--faint)">${IC.chev}</span>${coinMark(conv.to,44)}</div>
      <div style="font-size:26px;font-weight:600;margin-top:14px">${amt} ${conv.from} → ${trimNum(out)} ${conv.to}</div>
      <div class="muted" style="font-weight:500;margin-top:4px">${hide(fmtUSD(usd))} · fee ${hide(fmtUSD(usd*0.005))}</div>
    </div>
    <button class="btn wide" style="margin-top:18px" onclick="confirmConvert()">Confirm convert</button>
   </div>`));
}
function confirmConvert(){
  const f=asset(conv.from), t=asset(conv.to);
  const amt=parseFloat(conv.amt)||0, usd=amt*f.price, out=(usd-usd*0.005)/t.price;
  if(!Number.isFinite(amt) || amt<=0 || conv.from===conv.to || amt>f.amount+1e-12){ hideModal(); toast('Enter a valid amount within your balance'); return; }
  f.amount=Math.max(0,f.amount-amt); t.amount+=out;
  state.transactions.push({id:'tx_'+Date.now(),hash:txHash(conv.to),type:'convert',sym:conv.to,amount:out,ts:Date.now(),status:'done',confirmations:confirmationsNeeded(conv.to),from:conv.from,fee:usd*0.005,feeUsd:usd*0.005});
  save(); hideModal(); conv.amt=''; render(false); toast('Converted '+amt+' '+conv.from+' to '+trimNum(out)+' '+conv.to);
}

const TX_FILTERS=[['all','All'],['buy','Buy'],['send','Sent'],['receive','Received'],['convert','Convert']];
function viewActivity(){
  let tx=[...state.transactions].sort((a,b)=>b.ts-a.ts);
  if(ui.txFilter!=='all') tx=tx.filter(t=>t.type===ui.txFilter);
  return `
  <div class="secthead" style="margin:0 0 16px">
    <h2 style="font-size:19px">Activity</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${TX_FILTERS.map(([k,l])=>`<button class="chip ${ui.txFilter===k?'on':''}" onclick="setTxFilter('${k}')">${l}</button>`).join('')}
    </div>
  </div>
  <div class="card">
    <table class="tbl">
      <thead><tr><th>Type</th><th>Date</th><th>Counterparty</th><th class="r">Amount</th><th class="r">Value</th><th class="r">Status</th></tr></thead>
      <tbody>
        ${tx.length? tx.map(txTr).join('') : '<tr style="cursor:default"><td colspan="6" style="text-align:center;padding:50px" class="faint">No transactions found</td></tr>'}
      </tbody>
    </table>
  </div>`;
}
function txTr(t){
  const map={send:['Sent','var(--text)',IC.arrowup],receive:['Received','var(--green)',IC.arrowdown],buy:['Bought','var(--green)',IC.buy],sell:['Sold','var(--text)',IC.arrowup],convert:['Converted','var(--text)',IC.trade]};
  const c=map[t.type]||map.send;
  const cp=t.type==='send'?'to '+short(t.to||''):t.type==='receive'?'from '+short(t.from||''):t.type==='convert'?(t.from||'')+' → '+t.sym:(t.method||'Market order');
  const sign=t.type==='send'?'-': (t.type==='convert'?'':(t.type==='sell'?'-':'+'));
  const st=txStatus(t);
  return `<tr onclick="openTx('${esc(t.id)}')">
    <td><div class="cellasset" style="color:${c[1]}"><span style="width:20px;display:inline-flex">${c[2]}</span>${c[0]} ${t.sym}</div></td>
    <td class="muted">${ago(t.ts)}<div class="faint" style="font-size:12px;font-weight:600">${dayLabel(t.ts)}</div></td>
    <td class="faint" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${esc(cp)}</td>
    <td class="r num" style="color:${c[1]}">${hide(sign+fmtAmt(t.amount,t.sym).replace(' '+t.sym,''))} <span class="faint" style="font-weight:500">${t.sym}</span></td>
    <td class="r num">${hide(fmtUSD(txUsd(t)))}</td>
    <td class="r"><span class="badge ${st.cls}">● ${st.label}</span></td>
  </tr>`;
}
function setTxFilter(f){ if(!TX_FILTERS.some(([k])=>k===f)) return; ui.txFilter=f; render(false); }

function saveProfile(name,handle){

  state.profile={...state.profile,name,handle:'@'+handle}; save(); hideModal(); render(false); return true;
}

function onSearch(q){
  const box=$('#searchres'); q=(q||'').trim().toLowerCase();
  if(!q){ box.classList.remove('on'); return; }
  const all=[...state.assets,...markets.filter(a=>!state.assets.some(h=>h.sym===a.sym))];
  const hits=all.filter(a=>a.sym.toLowerCase().includes(q)||META[a.sym].name.toLowerCase().includes(q));
  box.innerHTML = hits.length? hits.map(a=>`<div class="sr" onclick="pickSearch('${a.sym}')">${coinMark(a.sym,30)}<span class="nm">${META[a.sym].name} <span class="faint">${a.sym}</span></span><span class="pr">${hide(fmtPrice(a.price))}</span></div>`).join('') : '<div class="sr faint">No matches</div>';
  box.classList.add('on');
}
function pickSearch(sym){ $('#searchres').classList.remove('on'); $('#search').value=''; go('asset',{sym}); }

/* ============================ MODALS ============================ */
let modalLoadTimer=null;
function loadModal(label,ready){
  showModal(`<div class="modal-head"><h3>Please wait</h3><button class="iconbtn" onclick="hideModal()" aria-label="Close">${IC.close}</button></div><div class="modal-body">${loadingMarkup(label)}<button class="btn wide" disabled>Loading…</button></div>`);
  $('#modal').setAttribute('aria-busy','true');
  modalLoadTimer=setTimeout(()=>{modalLoadTimer=null;ready();},320);
}
function showModal(html, cls, direction='forward'){
  clearTimeout(modalLoadTimer); modalLoadTimer=null;
  const m=$('#modal'); m.className='modal'+(cls?' '+cls:''); m.innerHTML=html;
  m.removeAttribute('aria-busy');
  m.classList.add('on'); $('#overlay').classList.add('on');
  slideIn(m.querySelector('.modal-body'),direction);
}
function hideModal(){ clearTimeout(modalLoadTimer); modalLoadTimer=null; $('#modal').removeAttribute('aria-busy'); $('#modal').classList.remove('on'); $('#overlay').classList.remove('on'); }
$('#overlay').addEventListener('click', hideModal);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ hideModal(); $('#searchres').classList.remove('on'); } if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#search').focus(); } });
document.addEventListener('contextmenu', e=>e.preventDefault());

/* ---- picker ---- */
let pickerTarget='send';
function pickerAssets(target){
  if(target!=='send' && target!=='receive') return state.assets;
  return [...state.assets,...markets.filter(a=>!state.assets.some(h=>h.sym===a.sym))];
}
function pickerRows(query=''){
  const q=query.trim().toLowerCase();
  const hits=pickerAssets(pickerTarget).filter(a=>a.sym.toLowerCase().includes(q)||META[a.sym].name.toLowerCase().includes(q));
  return hits.map(a=>`<button class="opt" onclick="choosePicker('${a.sym}')">${coinMark(a.sym,38)}<span class="mp-picker-name">${esc(META[a.sym].name)}<small>${a.sym}</small></span><span class="mp-setting-chevron">${IC.chev}</span></button>`).join('') || '<p class="mp-picker-empty">No assets found.</p>';
}
function filterPicker(query){ $('#pickerResults').innerHTML=pickerRows(query); }
function openPicker(target){
  pickerTarget=target;
  loadModal('Loading assets…',()=>{
    showModal(`<div class="modal-head"><h3>${target==='receive'?'Receive crypto':'Select asset'}</h3><button class="iconbtn" onclick="hideModal()" aria-label="Close">${IC.close}</button></div><div class="modal-body mp-picker-body"><div class="input mp-picker-search"><input id="pickerSearch" type="search" placeholder="Search name or symbol" aria-label="Search assets" autocomplete="off" oninput="filterPicker(this.value)"></div><div id="pickerResults" class="mp-picker-results">${pickerRows()}</div></div>`);
    $('#pickerSearch').focus({preventScroll:true});
  });
}
function choosePicker(sym){
  hideModal();
  if(pickerTarget==='send') openSend(sym,send.mode);
  else if(pickerTarget==='receive') openReceive(sym);
  else if(pickerTarget==='tradeFrom'){ conv.from=sym; if(conv.from===conv.to) conv.to=state.assets.find(a=>a.sym!==sym).sym; render(false); }
  else if(pickerTarget==='tradeTo'){ conv.to=sym; if(conv.from===conv.to) conv.from=state.assets.find(a=>a.sym!==sym).sym; render(false); }
}

        <div class="faint" style="font-weight:500;font-size:12.5px;margin-top:8px" id="sendUsd"></div></div>`}
      <button class="btn wide" style="margin-top:6px" id="sendNext" ${canNext()?'':'disabled'} onclick="sendStep('review')">${buy?'Review purchase':'Review'}</button>
      <div class="faint" style="text-align:center;font-size:12px;font-weight:600;margin-top:12px">${buy?'Review the amount and provider fee before confirming.':'Check the recipient and network before continuing.'}</div>
    </div>`;
  }
  if(send.step==='review'){
    const amt=parseFloat(send.amt)||0, buy=send.mode==='buy', amtUsd=toUSD(amt);
    const fee=buy?0:networkFee(send.sym,send.feeTier);
    const feeUsd=fee*a.price, tier=FEE_TIERS[send.feeTier]||FEE_TIERS.standard;
    const q=buy?buyQuote(amtUsd,buyMethod):null;
    return `<div class="modal-head"><h3>${buy?'Confirm purchase':'Review send'}</h3><button class="iconbtn" onclick="sendStep('form')" aria-label="Back">${IC.back}</button></div>
    <div class="modal-body">
      ${buy?'':`<div class="fl">Network speed</div><div class="seg" style="width:100%;margin-bottom:16px">${Object.entries(FEE_TIERS).map(([k,v])=>`<button style="flex:1" class="${send.feeTier===k?'on':''}" onclick="setFeeTier('${k}')">${v.label}</button>`).join('')}</div>`}
      <div class="center">
        ${coinMark(send.sym,58)}
        <div style="font-size:26px;font-weight:600;margin-top:12px" class="num">${buy? hide(fmtUSD(amtUsd)) : fmtAmt(amt,send.sym)}</div>
        <div class="muted" style="font-weight:500;margin-top:3px">${buy? trimNum(q.receive/a.price)+' '+send.sym : hide(fmtUSD(amt*a.price))}</div>
      </div>
      <div class="card" style="box-shadow:none;padding:4px 18px;margin-top:16px">
        ${buy
          ? `<div class="kv"><span class="k">Pay with</span><span class="v">${esc(q.method.label)}</span></div>
             <div class="kv"><span class="k">Price</span><span class="v">${hide(fmtPrice(a.price))}</span></div>
             <div class="kv"><span class="k">Provider fee (${(q.method.fee*100).toFixed(2)}%)</span><span class="v">${hide(fmtUSD(q.fee))}</span></div>
             <div class="kv"><span class="k">You receive</span><span class="v">${trimNum(q.receive/a.price)} ${send.sym}</span></div>`
           : `<div class="kv"><span class="k">From</span><span class="v">Wallet balance</span></div>
             <div class="kv"><span class="k">To</span><span class="v" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${esc(send.to)}</span></div>
             <div class="kv"><span class="k">Network</span><span class="v">${esc(networkOf(a.sym))}</span></div>
             <div class="kv"><span class="k">Network fee · ${esc(tier.label)} (${esc(tier.eta)})</span><span class="v">${fmtAmt(fee,send.sym)} · ${hide(fmtUSD(feeUsd))}</span></div>
             <div class="kv"><span class="k">Total</span><span class="v">${fmtAmt(amt+fee,send.sym)}</span></div>`}
      </div>
      <button class="btn wide" style="margin-top:18px" onclick="sendCommit()">${buy?'Buy now':'Confirm & send'}</button>
    </div>`;
  }
  if(send.step==='processing'){
    return `<div class="modal-body" style="padding:22px 24px 34px"><div class="spin"></div>
      <div style="text-align:center;font-weight:600;font-size:16px">${send.mode==='buy'?'Processing purchase…':'Processing transfer…'}</div>
      <div class="faint" style="text-align:center;font-weight:500;margin-top:6px;font-size:13px">Updating your ${send.sym} balance</div></div>`;
  }
  if(send.step==='success'){
    const buy=send.mode==='buy';
    return `<div class="modal-body" style="padding:24px 24px 28px">
      <div class="checkcircle">${IC.check}</div>
      <div style="text-align:center;font-weight:600;font-size:22px;margin-top:18px">${buy?'Purchase complete':'Sent'}</div>
      <div class="muted" style="text-align:center;font-weight:500;margin-top:4px">${buy? 'You bought '+fmtAmt(send.received,send.sym) : fmtAmt(parseFloat(send.amt)||0,send.sym)+' is on its way'}</div>
      <div class="badge ${buy?'up':'warn'}" style="justify-content:center;margin-top:10px">● ${buy?'Completed':'Pending · 0/'+confirmationsNeeded(send.sym)}</div>
      <div class="addrbox"><code>${esc(send.hash)}</code><button class="iconbtn" onclick="copyText('${send.hash}')">${IC.copy}</button></div>
      <p class="faint" style="text-align:center;font-weight:500;font-size:12.5px;margin-top:10px">${buy?'Your balance has been updated.':'It shows as pending until the network confirms it.'}</p>
      <button class="btn wide" style="margin-top:16px" onclick="hideModal();go('home')">Done</button>
    </div>`;
  }
}
// a recipient must be a real address for the selected chain, or an ENS name
function canNext(){
  const a=asset(send.sym), amount=Number(send.amt);
  if(!Number.isFinite(amount)||amount<=0) return false;
  if(send.mode==='buy'){ const m=buyMethodById(buyMethod), usd=toUSD(amount); return Number.isFinite(a.price)&&a.price>0&&usd>=m.min&&usd<=m.max; }
  return validAddress(send.sym,send.to) && amount<=a.amount+1e-12;
}
function sendHintFor(){
  if(send.mode==='buy'){
    const n=toUSD(send.amt), m=buyMethodById(buyMethod);
    if(!Number.isFinite(n) || n<=0) return '';
    if(n<m.min) return 'Minimum purchase by '+m.label+' is '+fmtUSD(m.min)+'.';
    if(n>m.max){
      const alt=BUY_METHODS.find(x=>x.max>n);
      return m.label+' is limited to '+fmtUSD(m.max)+' per transaction'+(alt?' — switch to '+alt.label+' for up to '+fmtUSD(alt.max)+'.':'.');
    }
    return '';
  }
  const t=(send.to||'').trim();
  return (t && !validAddress(send.sym,t)) ? 'That is not '+addrLabel(send.sym)+'.' : '';
}
function sendToInput(v){ send.to=v; const h=$('#sendHint'); if(h) h.textContent=sendHintFor(); const b=$('#sendNext'); if(b) b.disabled=!canNext(); }
function setRecipient(address){ send.to=address; const el=$('#sendTo'); if(el) el.value=address; sendToInput(address); }
function sendAmtInput(v){
  send.amt=v; const a=asset(send.sym), n=parseFloat(v)||0;
  const usd=$('#sendUsd'), feeEl=$('#buyFee'), hint=$('#sendHint');
  if(send.mode==='buy'){
    const q=buyQuote(toUSD(n),buyMethod);
    if(usd) usd.textContent = n? '≈ '+trimNum(q.receive/a.price)+' '+send.sym : '';
    if(feeEl) feeEl.textContent = n? 'Provider fee '+fmtUSD(q.fee)+' · '+q.method.label : '';
    if(hint) hint.textContent = sendHintFor();
  } else {
    const over=n>a.amount+1e-12;
    if(usd) usd.textContent = over? 'Insufficient balance' : (n? '≈ '+fmtUSD(n*a.price) : '');
    if(hint) hint.textContent = send.to ? sendHintFor() : '';
  }
  const b=$('#sendNext'); if(b) b.disabled=!canNext();
}
function sendMax(){ const a=asset(send.sym); const fee=networkFee(send.sym,send.feeTier); send.amt=trimNum(Math.max(0,a.amount-fee*1.1)); const el=$('#sendAmt'); if(el) el.value=send.amt; sendAmtInput(send.amt); }
function setFeeTier(t){ if(!FEE_TIERS[t]) return; send.feeTier=t; showModal(sendBody()); }
function sendStep(s){
  if(s==='review'){
    if(!canNext()) return;
    loadModal('Preparing review…',()=>{send.step=s;showModal(sendBody());});
  }else{send.step=s;showModal(sendBody(),'','back');}
}
let transferPending=false;
function sendCommit(){
  if(transferPending) return;
  const source=asset(send.sym), amt=Number(send.amt), buy=send.mode==='buy';
  if(!canNext()){ toast(buy?'Enter an amount within your limit':'Enter a valid amount and recipient'); return; }
  if(!buy && amt>source.amount+1e-12){ toast('Insufficient '+send.sym+' balance'); return; }
  const flow=send;
  const fee=buy?0:networkFee(send.sym,send.feeTier);
  const quote=buy?buyQuote(toUSD(amt),buyMethod):null;
  transferPending=true;
  send.step='processing'; showModal(sendBody());
  setTimeout(()=>{
    const hash=txHash(flow.sym), nowTs=Date.now();
    let a=state.assets.find(a=>a.sym===flow.sym);
    if(!a){a={...source,amount:0};state.assets.push(a);}
    if(buy){
      const got=quote.receive/source.price;
      flow.received=got; a.amount+=got;
      state.transactions.push({id:'tx_'+nowTs,hash,type:'buy',sym:flow.sym,amount:got,ts:nowTs,status:'done',confirmations:confirmationsNeeded(flow.sym),method:quote.method.label,fee:quote.fee,feeUsd:quote.fee});
    } else {
      // outbound transfers stay pending until the network confirms them
      a.amount=Math.max(0,a.amount-amt);
      state.transactions.push({id:'tx_'+nowTs,hash,type:'send',sym:flow.sym,amount:amt,ts:nowTs,status:'pending',confirmations:0,to:flow.to,fee,feeUsd:fee*source.price});
    }
    save(); flow.hash=hash; flow.fee=fee; flow.step='success'; transferPending=false;
    render(false);
    if(send===flow && $('#modal').classList.contains('on')) showModal(sendBody());
    toast(buy?'Purchase confirmed':'Transaction submitted');
  },1700);
}

/* ---- receive ---- */
function receivingDetails(sym){
  if(state.receivingAddresses[sym]) return state.receivingAddresses[sym];
  // The roleplay view uses stable placeholders, never actual deposit wallets.
  if(!state.addresses[sym]){state.addresses[sym]=makeAddress(sym);save();}
  return {address:state.addresses[sym],network:networkOf(sym),memo:'',preview:true};
}
function openReceive(sym){
  loadModal('Loading deposit details…',()=>showReceive(sym));
}
function showReceive(sym,edit=false){
  const s=sym||'BTC';
  let receiving=state.receivingAddresses[s];
  if(edit){
    showModal(`<div class="modal-head"><h3>Receive ${esc(META[s].name)}</h3><button class="iconbtn" onclick="hideModal()">${IC.close}</button></div>
      <form class="modal-body" onsubmit="event.preventDefault();saveReceiving('${s}')"><button type="button" class="assetpick" onclick="openPicker('receive')">${coinMark(s,36)}<div><div class="nm">${esc(META[s].name)}</div><div class="sb">${s}</div></div><span class="chev">${IC.chev}</span></button>
      <p class="muted">Add an address from a wallet you control to receive ${s}.</p>
      <div class="field"><label class="fl" for="receiveNetwork">Network</label><div class="input"><input id="receiveNetwork" maxlength="60" value="${esc(receiving?.network||networkOf(s))}" placeholder="Enter the receiving network" required></div></div>
      <div class="field"><label class="fl" for="receiveAddress">Receiving address</label><div class="input"><input id="receiveAddress" value="${esc(receiving?.address||'')}" minlength="10" maxlength="256" autocomplete="off" spellcheck="false" placeholder="Paste your wallet address" required></div></div>
      <div class="field"><label class="fl" for="receiveMemo">Memo / tag (if required)</label><div class="input"><input id="receiveMemo" value="${esc(receiving?.memo||'')}" maxlength="128" autocomplete="off" placeholder="Optional"></div></div>
      <p id="receiveError" class="down" role="alert"></p><button class="btn wide" type="submit">Save receiving details</button>
      <p class="faint">Confirm that the address and network match in your wallet. Network compatibility is not checked automatically.</p></form>`);
    return;
  }
  receiving=receivingDetails(s);
  showModal(`<div class="modal-head"><h3>Receive ${META[s].name}</h3><button class="iconbtn" onclick="hideModal()">${IC.close}</button></div>
  <div class="modal-body">
    <button class="assetpick" onclick="openPicker('receive')">${coinMark(s,34)}<div><div class="nm">${META[s].name}</div><div class="sb">${esc(receiving.network)} network</div></div><span class="chev">${IC.chev}</span></button>
    <div class="qrcard"><canvas class="qrcanvas" id="qrcanvas" data-address="${esc(receiving.address)}" width="224" height="224"></canvas></div>
    <div class="addrbox"><code id="recvAddr">${esc(receiving.address)}</code><button class="iconbtn" onclick="copyText($('#recvAddr').textContent)" aria-label="Copy receiving address">${IC.copy}</button></div>
    ${receiving.memo?`<div class="addrbox"><span class="muted">Memo / tag</span><code id="recvMemo">${esc(receiving.memo)}</code><button class="iconbtn" onclick="copyText($('#recvMemo').textContent)" aria-label="Copy memo">${IC.copy}</button></div><p class="faint">QR contains the address only. Include the memo / tag when sending.</p>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <button class="btn ghost" onclick="showReceive('${s}',true)">Edit address</button>
      <button class="btn ghost" onclick="shareReceiving('${s}')">Share</button>
    </div>
    <div class="faint" style="text-align:center;font-size:12px;font-weight:600;margin-top:14px">${receiving.preview?'Address preview — not for deposits.':`Only send ${s} on the ${esc(receiving.network)} network to this address.`}</div>
  </div>`, '');
  drawQR($('#qrcanvas'), receiving.address);
}
function saveReceiving(sym){
  const address=$('#receiveAddress').value.trim(),network=$('#receiveNetwork').value.trim(),memo=$('#receiveMemo').value.trim();
  if(!Object.hasOwn(META,sym) || !validAddress(sym,address) || !network || network.length>60 || memo.length>128 || /[\x00-\x1f\x7f]/.test(network+memo)){
    $('#receiveError').textContent='Enter '+addrLabel(sym)+', a network and an optional memo.';return false;
  }
  state.receivingAddresses[sym]={address,network,memo}; save();showReceive(sym);return true;
}
function shareReceiving(sym){
  const r=receivingDetails(sym);
  const text=`${r.preview?'Address preview — not for deposits.\n':''}${sym} · ${r.network}\n${r.address}${r.memo?'\nMemo / tag: '+r.memo:''}`;
  if(navigator.share) navigator.share({title:'Receive '+sym,text}).catch(e=>{if(e.name!=='AbortError')copyText(text);});
  else copyText(text);
}
function drawQR(canvas,text){
  if(!canvas || !text) return;
  const ctx=canvas.getContext('2d'),size=canvas.width;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
  try{
    const qr=window.qrcode(0,'M');qr.addData(text);qr.make();
    const n=qr.getModuleCount(),cell=size/(n+8);
    ctx.fillStyle='#0A0B0D';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x)){
      const left=Math.round((x+4)*cell),top=Math.round((y+4)*cell);
      ctx.fillRect(left,top,Math.round((x+5)*cell)-left,Math.round((y+5)*cell)-top);
    }
  }catch(e){canvas.hidden=true;toast('QR unavailable. Copy the address instead.');}
}
function copyText(t){ if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('Copied to clipboard')).catch(()=>toast('Could not copy. Select the address manually.')); else toast('Clipboard unavailable. Select the address manually.'); }

/* ---- toasts ---- */
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  $('#toasts').appendChild(el); requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>{ el.classList.remove('on'); setTimeout(()=>el.remove(),300); }, 2400);
}

/* ============================ HARDWARE KEY LOCK ============================
   Insert a USB device and the wallet unlocks. Browsers can't see flash drives at
   all — USB mass storage is a protected class in the WebUSB spec — so the launcher
   runs usbwatch.py and this polls it while the lock screen is up. The watcher is
   killed with the window, so nothing watches USB while the wallet is closed.  */
const USBW={port:8765, base:null, timer:null, off:false, hooked:false};
let unlockTimer=null, unlocking=false, lockGeneration=0;
function cancelUnlock(){
  clearTimeout(unlockTimer); unlockTimer=null; unlocking=false; lockGeneration++;
  $('#lock').classList.remove('is-opening','is-revealing');
  $('#unlock-splash').setAttribute('aria-hidden','true');
  $('#connection-card').removeAttribute('aria-hidden');
}
let ledgerAnimation;
function deviceAnimation(stage){
  if(!window.lottie || typeof LEDGER_CONNECT==='undefined') return;
  if(!ledgerAnimation) ledgerAnimation=window.lottie.loadAnimation({
    container:$('#ledger-animation'),renderer:'svg',loop:true,autoplay:false,
    animationData:JSON.parse(JSON.stringify(LEDGER_CONNECT)),
  });
  if(stage==='search' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) ledgerAnimation.play();
  else ledgerAnimation.goToAndStop(82,true);
}
function lockEls(){ return { el:$('#lock') }; }
function keyMatches(d){ const k=state.settings.key; return !!k && d.id===k.id; }
function keySearchMsg(){ const k=state.settings.key;
  return k ? 'Searching for '+k.name+'\u2026' : 'Searching for a USB device\u2026'; }
// staged like a real hardware handshake: search -> connect -> connected, each held
// long enough to read, so the unlock feels like something happened
function lockStage(stage, msg){
  const el=$('#lock');
  el.classList.remove('wait','search','connect','ok','is-wait','is-search','is-connect','is-ok'); el.classList.add('is-'+stage);
  if(msg) $('#lockmsg').textContent=msg;
  deviceAnimation(stage);
}
function lockStop(){ if(USBW.timer){ clearInterval(USBW.timer); USBW.timer=null; } USBW.base=null; }
function lockInit(){
  cancelUnlock();
  const {el}=lockEls();
  if(!state.settings.lock){ el.classList.remove('on'); lockStop(); return; }
  el.classList.add('on');
  document.body.classList.add('locked');
  USBW.base=null; USBW.off=false;
  const k=state.settings.key;
  lockStage('search', keySearchMsg());
  if(USBW.timer) return;                       // already polling
  if(!USBW.hooked){                            // browsers throttle timers in hidden
    USBW.hooked=true;                          // windows, so also poll when looked at
    addEventListener('focus', lockPoll);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) lockPoll(); });
  }
  lockPoll();
  USBW.timer=setInterval(lockPoll, 1500);
}
async function lockPoll(){
  if(unlocking || !$('#lock').classList.contains('on')) return;
  const generation=lockGeneration;
  let d=null;
  try{ const r=await fetch('http://127.0.0.1:'+USBW.port+'/state',{cache:'no-store'}); d=r.ok?await r.json():null; }catch(e){ d=null; }
  if(generation!==lockGeneration || unlocking || !$('#lock').classList.contains('on')) return;
  const k=state.settings.key;
  if(!d || !d.devices){
    if(!USBW.off){ USBW.off=true; lockStage('wait','Key service not running \u2014 open the wallet from the MoonPay launcher.'); }
    return;
  }
  if(USBW.off){ USBW.off=false; lockStage('search', keySearchMsg()); }
  if(USBW.base===null){                        // first look: note what was already plugged in
    USBW.base=d.devices.map(x=>x.id);
    if(k){ const cur=d.devices.find(x=>x.id===k.id); if(cur) return keyUnlock(cur); }
    return;
  }
  const added=d.devices.filter(x=>!USBW.base.includes(x.id));
  if(!added.length) return;
  if(k){ const cur=added.find(x=>x.id===k.id); if(cur) return keyUnlock(cur); }
  else keyUnlock(added[0], true);              // nothing registered: this device becomes the key
}
function keyUnlock(d, register){
  const el=$('#lock');
  if(unlocking || !el.classList.contains('on')) return;
  if(state.settings.key && !keyMatches(d)) return;
  unlocking=true;
  if(register){
    const fresh=!state.settings.key;
    state.settings.key={id:d.id, name:d.name||'USB device'};
    save();
    if(fresh && route.name==='settings') render(false);   // keep the settings row honest
  }
  lockStop();
  lockStage('connect', 'Found '+(d.name||'USB device')+' \u2014 connecting\u2026');
  unlockTimer=setTimeout(()=>{
    lockStage('ok','Connected');
    unlockTimer=setTimeout(()=>{
      if(ledgerAnimation) ledgerAnimation.pause();
      el.classList.add('is-opening');
      $('#connection-card').setAttribute('aria-hidden','true');
      $('#unlock-splash').removeAttribute('aria-hidden');
      route={name:'home',params:{}};
      loadPage('forward');
      unlockTimer=setTimeout(()=>{
        el.classList.add('is-revealing');
        slideIn($('.app'),'forward');
        unlockTimer=setTimeout(()=>{
          el.classList.remove('on'); document.body.classList.remove('locked'); cancelUnlock();
        },450);
      },1000);
    },600);
  }, 900);
}
function lockSkip(){
  const {el}=lockEls();
  cancelUnlock();
  lockStop();
  if(ledgerAnimation) ledgerAnimation.pause();
  el.classList.remove('on','wait','ok','is-wait','is-search','is-connect','is-ok');
  document.body.classList.remove('locked');
}
function lockNow(){ state.settings.lock=true; save(); lockInit(); toast('Wallet locked'); }
// hidden way out, for the case where no key can be registered at all; never shown in the UI
document.addEventListener('keydown', e=>{
  const l=$('#lock');
  if(l && l.classList.contains('on') && e.shiftKey && String(e.key).toUpperCase()==='U'){ e.preventDefault(); lockSkip(); }
});
function toggleLock(){ state.settings.lock=!state.settings.lock; save(); render(false);
  toast(state.settings.lock?'Key required on every start':'Key requirement off'); }

window.addEventListener('resize', ()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(afterRender,150); });
render(true);
lockInit();
</script>
